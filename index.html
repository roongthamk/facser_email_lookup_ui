<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>

    body {
      font-family: Arial, sans-serif;
      margin: 15px;
    }

    input {
      width: 100%;
      max-width: 400px;
      padding: 8px;
      box-sizing: border-box;
    }

    button {
      margin-top: 10px;
      padding: 8px 12px;
    }

    .result {
      margin-top: 15px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
    }

  </style>

</head>

<body>

<h2>ค้นหาอีเมล์ที่ได้รับอนุมัติสำหรับการขอแจ้งซ่อม</h2>
<p>CUVET Nakornpathom Center</p>

<input
  type="text"
  id="searchBox"
  placeholder="พิมพ์ชื่อหรือบางส่วนของชื่อ"
  onkeydown="if(event.key==='Enter') search();">

<br><br>

<button onclick="search()">ค้นหา</button>

<div id="results"></div>

<script>

const API_URL =
  "1Tz175d_hVFf091W92O9-w3kUHSkPncqobrNnSYiYQU4";

function search() {

  const text =
    document.getElementById("searchBox").value.trim();

  if (!text) return;

  document.getElementById("results").innerHTML =
    "<p>กำลังค้นหา...</p>";

  fetch(API_URL + "?name=" + encodeURIComponent(text))
    .then(res => res.json())
    .then(data => displayResults(data))
    .catch(err => {
      console.error(err);
      document.getElementById("results").innerHTML =
        "<p>เกิดข้อผิดพลาด</p>";
    });

}

function displayResults(results) {

  let html = "";

  if (!results || results.length === 0) {

    html = "<p>ไม่พบข้อมูล</p>";

  } else {

    results.forEach(r => {

      html +=
        "<div class='result'>" +
        "<b>" + r.name + "</b><br><br>";

      r.emails.forEach(email => {
        html += email + "<br>";
      });

      html += "</div>";

    });

  }

  document.getElementById("results").innerHTML = html;
}

</script>

</body>
</html>
